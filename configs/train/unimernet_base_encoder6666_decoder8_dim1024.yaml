model:
  arch: unimernet
  model_type: unimernet
  tokenizer_name: nougat
  tokenizer_config:
    path: ./models/unimernet_base
  model_config:
    model_name: ./models/unimernet_base
    max_seq_len: 1536

  load_pretrained: False
  load_finetuned: False


datasets:

  formula_rec_train:
    sample_ratio: 1
    vis_processor:
      train:
        name: "formula_image_train"
        image_size:
          - 192
          - 672
    text_processor:
      train:
        name: "blip_caption"
        max_words: 1536

    build_info:
      # unimath_train
      images: /home/ubuntu/bigdiskdata/baiweikang/ablation_1M_for_unimer/images
      annotation: /home/ubuntu/bigdiskdata/baiweikang/ablation_1M_for_unimer/equations.txt

run:
  runner: runner_iter
  task: unimernet_train

  aug_repeats: 5
  keep_original: true
  
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4          # 峰值学习率
  min_lr: 1e-6           # 最终学习率
  warmup_lr: 1e-6        # warmup起始学习率
  weight_decay: 0.05
  
  # batch size
  batch_size_train: 5    # 每GPU的batch size
  batch_size_eval: 16
  accum_grad_iters: 4    # 梯度累积步数
  num_workers: 8
  
  # training epochs
  # iters_per_epoch 会自动计算: dataset_size * aug_repeats / (batch_size_train * world_size)
  max_epoch: 3
  warmup_steps: 800     # warmup步数

  seed: 42
  
  output_dir: "/home/ubuntu/baiweikang/diskdata/Models/UniMERNet/weights_1"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: [ "train" ]
  valid_splits: []       # 设为空列表，完全禁用eval

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  distributed_type: ddp



  generate_cfg:
    temperature: 0.0
