model:
  arch: unimernet
  model_type: unimernet
  tokenizer_name: nougat
  tokenizer_config:
    path: ./models/unimernet_base
  model_config:
    model_name: ./models/unimernet_base
    max_seq_len: 1536

  load_pretrained: False
  load_finetuned: False


datasets:

  formula_rec_train:
    sample_ratio: 1
    vis_processor:
      train:
        name: "formula_image_train"
        image_size:
          - 192
          - 672
    text_processor:
      train:
        name: "blip_caption"
        max_words: 1536

    build_info:
      # unimath_train
      images: /home/ubuntu/bigdiskdata/baiweikang/ablation_1M_for_unimer/images
      annotation: /home/ubuntu/bigdiskdata/baiweikang/ablation_1M_for_unimer/equations.txt

run:
  runner: runner_iter
  task: unimernet_train
  
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4          # 峰值学习率
  min_lr: 1e-6           # 最终学习率
  warmup_lr: 1e-6        # warmup起始学习率
  weight_decay: 0.05
  
  # batch size
  batch_size_train: 4    # 每GPU的batch size
  batch_size_eval: 8
  accum_grad_iters: 1    # 梯度累积步数
  num_workers: 8
  
  # training iterations (基于8卡计算)
  # 数据集: 1,000,000 样本
  # effective_batch = batch_size_train * world_size = 4 * 8 = 32
  # 1 epoch = 1,000,000 / 32 = 31,250 iters
  # 3 epochs = 93,750 iters
  warmup_steps: 3125     # 约10%的1个epoch
  iters_per_inner_epoch: 31250   # 每个epoch的iteration数
  max_iters: 93750       # 3个epochs
  milestone: [1, 2, 3]   # 在第1、2、3个epoch结束时额外保存checkpoint

  seed: 42
  
  output_dir: "/home/ubuntu/baiweikang/diskdata/Models/UniMERNet/weights_1"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: [ "train" ]
  valid_splits: []       # 设为空列表，完全禁用eval

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  distributed_type: ddp

  generate_cfg:
    temperature: 0.0
